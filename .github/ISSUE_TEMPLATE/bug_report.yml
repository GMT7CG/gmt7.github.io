name: Bug report
description: Report a problem with the site
labels:
  - bug
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is broken.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How to see the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Page URL
      description: Which page on gmt7.org shows the problem.
    validations:
      required: false
  - type: input
    id: environment
    attributes:
      label: Browser and device
      description: Example, Safari on iPhone, Chrome on Windows.
    validations:
      required: false
